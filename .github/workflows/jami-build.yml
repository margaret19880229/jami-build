# WeAdd jami-daemon moderator 镜像构建（单文件版：GH 云端 amd64 构建 → 推送 GHCR）
# 用法：在你的任意 GitHub 仓库建文件 .github/workflows/jami-build.yml，粘贴本文件，
#       commit 后 Actions 自动开跑（约 1.5~2.5 小时，大头是 contrib 编译）。
# 产出：ghcr.io/<owner>/<repo>:latest（amd64）。VPS 侧 docker pull 后打 tag 即可用。
name: jami-mod-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 更新 Clash 订阅文件不触发构建（工作流文件本身的改动仍会触发）
    paths-ignore:
      - "subscription/**"

# GITHUB_TOKEN 的 packages 权限默认是 read，显式给 write 才能推 GHCR
# （否则 push 时报 "denied: installation not allowed to Create organization package"）
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch jami-daemon source
        uses: actions/checkout@v4
        with:
          repository: savoirfairelinux/jami-daemon
          # 钉死 VPS 本地构建用的 commit：master 的 yffi/y-crdt pin 更新后
          # Cargo.lock 变成 v4 格式，ubuntu:24.04 自带的 cargo 1.75 解析不了
          # （lock file version 4 requires -Znext-lockfile-bump）
          ref: 91a048c83a47a48ba6c79b6dd315e0c2cbae0c97
          path: daemon

      - name: Write build files
        run: |
          cat > daemon/Dockerfile.moderator <<'EOF'
          # Jami DHT moderator 节点镜像
          # 构建上下文 = jami-daemon 仓库目录（官方 Dockerfile 的 apt 依赖清单 + cmake/ninja 构建）
          # 说明：官方仓库 Dockerfile 只构建不运行；本文件在其基础上补了
          #   1) dbus（jamid 的 D-Bus 接口需要 session bus，与 WSLC bot 的跑法一致）
          #   2) cargo（master 新增 yffi 组件 = yrs CRDT 的 Rust FFI，官方 apt 清单缺它）
          #   3) 非 root 用户 + 启动脚本（自起 session dbus-daemon 后 exec jamid）
          FROM ubuntu:24.04

          ARG DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y \
              autoconf automake autopoint bison build-essential cmake meson curl git \
              libarchive-dev libasio-dev libasound2-dev libdbus-1-dev libexpat1-dev \
              libgmp-dev nettle-dev libgnutls28-dev libjsoncpp-dev libmsgpack-dev \
              libnatpmp-dev libopus-dev libpipewire-0.3-dev libpulse-dev libspeex-dev \
              libspeexdsp-dev libssl-dev libsystemd-dev libtool libudev-dev libupnp-dev \
              libva-dev libvdpau-dev libvpx-dev libx264-dev libyaml-cpp-dev \
              libargon2-dev libwebrtc-audio-processing-dev libsecp256k1-dev \
              guile-3.0-dev nasm pkg-config yasm libcppunit-dev ninja-build sip-tester cargo \
              dbus ca-certificates

          # apt 的 cargo 1.75 解析不了 y-crdt 新 pin 的 Cargo.lock（v4 格式，
          # 要求 >=1.78）。装 rustup stable 并替换 /usr/bin/cargo——
          # contrib 规则里硬编码了 /usr/bin/cargo 这个绝对路径
          RUN curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh && \
              sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable && \
              ln -sf /root/.cargo/bin/cargo /usr/bin/cargo && \
              ln -sf /root/.cargo/bin/rustc /usr/bin/rustc

          WORKDIR /daemon
          COPY . .

          # 构建 daemon（与官方 Dockerfile 相同的 cmake/ninja 管线）
          RUN mkdir -p build && cd build && \
              cmake .. -GNinja -DJAMI_DBUS=ON && \
              ninja -j$(( $(nproc) > 4 ? 4 : $(nproc) ))

          # jamid 产物在 /daemon/build/（cmake 只 build 不 install），补进 PATH
          ENV PATH=/daemon/build:$PATH

          # 运行期准备：非 root 用户 + 状态目录
          # （构建过程会静默占用 uid 1000，先查再建/改名，避免 "UID 1000 is not unique"）
          RUN set -eux; \
              if getent passwd 1000 >/dev/null; then \
                  oldname=$(getent passwd 1000 | cut -d: -f1); \
                  echo "uid 1000 occupied by '$oldname' - renaming to jami"; \
                  usermod -l jami -d /home/jami -m "$oldname"; \
              else \
                  useradd -m -u 1000 -s /bin/sh jami; \
              fi; \
              mkdir -p /home/jami/.local/share/jami /home/jami/.dbus && \
              chown -R 1000:1000 /home/jami

          COPY moderator-entrypoint.sh /opt/moderator-entrypoint.sh
          RUN chmod +x /opt/moderator-entrypoint.sh

          USER 1000:1000
          ENV HOME=/home/jami
          ENTRYPOINT ["/opt/moderator-entrypoint.sh"]
          EOF
          cat > daemon/moderator-entrypoint.sh <<'EOF'
          #!/bin/sh
          # Jami moderator 启动脚本：自起 session D-Bus，然后 exec jamid
          # 与 WSLC jami-bot 容器的跑法保持一致（jamid 需要 session bus 提供
          # cx.ring.Ring.ConfigurationManager 接口，便于 D-Bus 配置/调试）
          set -e

          mkdir -p /home/jami/.dbus
          rm -f /home/jami/.dbus/addr

          dbus-daemon --session \
            --address=unix:path=/home/jami/.dbus/jami.sock \
            --print-address > /home/jami/.dbus/addr &
          BUS_PID=$!

          # 等待 socket 就绪
          i=0
          while [ $i -lt 50 ]; do
            [ -S /home/jami/.dbus/jami.sock ] && break
            sleep 0.1
            i=$((i + 1))
          done

          export DBUS_SESSION_BUS_ADDRESS=$(cat /home/jami/.dbus/addr)
          echo "session bus: $DBUS_SESSION_BUS_ADDRESS"

          # trap 让容器 SIGTERM 时能带走 dbus-daemon
          trap 'kill $BUS_PID 2>/dev/null || true' TERM INT

          exec jamid
          EOF
          chmod +x daemon/moderator-entrypoint.sh

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 注意：单架构 amd64 不需要 buildx；若用 cache-from: type=gha 必须配
      # docker/setup-buildx-action（GHA cache 后端由它初始化），否则 buildx 报错
      - name: Build (amd64)
        run: docker build -f daemon/Dockerfile.moderator -t jami-daemon-mod:latest daemon/

      - name: Push to GHCR
        run: |
          docker tag jami-daemon-mod:latest ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:latest

